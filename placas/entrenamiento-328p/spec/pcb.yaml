  R304: {x_mm: 62.0, y_mm: 19.5, rot: 0}
  R305: {x_mm: 66.5, y_mm: 19.5, rot: 0}
  R306: {x_mm: 71.0, y_mm: 19.5, rot: 0}
  Q302: {x_mm: 81.2, y_mm: 6.3, rot: 90}    # al lado de J405 (x > 78.5), fuera del cable y sin piezas altas
  R312: {x_mm: 81.2, y_mm: 10.6, rot: 90}
  # --- zona de manos: botones, perilla, buzzer, DIP ---
  SW301: {x_mm: 51.0, y_mm: 31.5, rot: 0}
