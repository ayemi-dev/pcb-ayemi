# =============================================================================
#  Placa de entrenamiento Ayemi (ATmega328P) · spec de la placa
#  Fuente de verdad para tools/pcb_setup.py, colocar.py, costura.py,
#  serigrafia.py y fab.py. Kiro completó los «POR DEFINIR» en la fase 3
#  (2026-10-28) según design.md sección 8. No se cambia sin avisar.
# =============================================================================

placa:
  nombre: "Chispa por Ayemi"     # nombre fijado por Dirección (2026-11-02)
  version: "0.1"
  ancho_mm: 90            # rev. 1b: el documento de Dirección permite hasta 80; 90 justificado en design.md 8.3
  alto_mm: 60
  radio_esquinas_mm: 3
  capas: 2
  grosor_mm: 1.6
  mascara: negra
  serigrafia: blanca
  piezas_solo_arriba: true
  origen_mm: [100, 80]    # esquina superior izquierda de la placa dentro del archivo de KiCad

barrenos:
  tipo: M3                # 3.2 mm, sin cobre (NPTH) salvo que design.md diga otra cosa
  separacion_borde_mm: 4
  huella: "MountingHole:MountingHole_3.2mm_M3"
  posiciones: [[4, 4], [86, 4], [4, 56], [86, 56]]   # H1 a H4
  exclusion_mm: 6.4       # diámetro libre de cobre y componentes

# Reglas conservadoras de JLCPCB para 2 capas estándar. La página de capacidades
# de JLCPCB no se pudo leer entera desde aquí (contenido dinámico); estas cifras son
# más estrictas que las capacidades estándar que conozco (0.127 / 0.127 mm, taladro de
# vía 0.3 mm, cobre a borde 0.2 mm). El DFM de la tarea 4.5 las confirma.
reglas:
  pista_minima_mm: 0.15
  separacion_minima_mm: 0.15
  via_diametro_mm: 0.6
  via_taladro_mm: 0.3
  anillo_minimo_mm: 0.15
  cobre_a_borde_mm: 0.3
  taladro_minimo_mm: 0.3
  serigrafia_alto_min_mm: 1.0
  serigrafia_trazo_min_mm: 0.15

clases_de_red:
  Default:  {pista_mm: 0.25, separacion_mm: 0.2}
  Potencia: {pista_mm: 0.5,  separacion_mm: 0.2, redes: ["+5V", "+3V3", VBUS, GND]}   # rev. 1: +3V3 entra, VBUS_F sale (la salida del PTC es +5V)
  USB:      {pista_mm: 0.3,  separacion_mm: 0.2, redes: [USB_DP, USB_DM]}

planos:
  - {red: GND, capas: [F.Cu, B.Cu], margen_borde_mm: 0.5, separacion_mm: 0.3}

costura_gnd:
  rejilla_mm: 5
  borde_paso_mm: 3
  borde_margen_mm: 1.5

# Ajustes de tools/rutear.py. El USB-C tiene sus pads a 0.5 mm de paso: no cabe una pista de 0.25 mm con
# 0.2 mm de aire entre pads de redes distintas en la rejilla de 0.1 mm. Esa zona se rutea aparte, en una
# «ventana» con rejilla de 0.05 mm y pista de 0.2 mm (aire de 0.2 mm, igual que el resto). Es una
# excepción al ancho de la clase USB (0.3 mm) y se anota en el reporte del paso.
ruteo:
  resolucion_mm: 0.1
  pasadas: 1            # si queda algo sin rutear, más pasadas lo promueven de prioridad (no ayudó en esta placa)
  abanico: [U1]         # piezas de paso fino: de cada pata sale un tramo recto antes de rutear
  abanico_mm: 1.0
  sin_vias: [XT1, XT2]  # design.md 10.5: las pistas del cristal van en la cara superior y sin vías
  refinar_s: 900        # con todo ruteado, cada red se rehace con A* exacto y se queda la más corta
  mejora_s: 1500        # tiempo para deshacer y reintentar las redes que estorban a una conexión pendiente
  fino: {pista_mm: 0.2, separacion_mm: 0.2}
  ventanas:
    - {nombre: "USB-C", x_mm: [7, 29], y_mm: [34, 59], resolucion_mm: 0.05, ancho_mm: 0.2, ancho_medio_mm: 0.4, redes: [CC1, CC2, USB_DM, USB_DP, VBUS], redes_medias: [VBUS], gnd_pads: [U102.2]}

areas_prohibidas:
  - nombre: CRISTAL
    descripcion: "Debajo del cristal y sus capacitores: solo GND y las dos redes del cristal"
    refs: [Y1, C1, C2]      # el contorno se calcula con estas piezas
    margen_mm: 0.3
    redes_permitidas: [GND, XT1, XT2]

# Zonas de la placa (fase 3), de design.md 8.2 y 8.3.
zonas:
  usb:        {borde: inferior, nota: "USB-C con la boca hacia afuera; ESD a < 10 mm"}
  grove:      {borde: superior, nota: "Los 5 conectores en el borde superior, boca hacia afuera, paso de 14 mm"}
  manos:      {x_mm: [40, 80], y_mm: [10, 56], nota: "Botones, potenciómetro y DIP lejos del USB-C (> 30 mm)"}
  headers:    {izquierdo: "J407: D0–D13 y GND", derecho: "J408: A0–A7, 5V, 3V3, GND y RESET"}

# Piezas con posición exacta (conectores, USB, headers y barrenos): x e y del origen de la huella.
fijos:
  H1:   {x_mm: 4,    y_mm: 4,     rot: 0}
  H2:   {x_mm: 86,   y_mm: 4,     rot: 0}
  H3:   {x_mm: 4,    y_mm: 56,    rot: 0}
  H4:   {x_mm: 86,   y_mm: 56,    rot: 0}
  J401: {x_mm: 17,   y_mm: 5.0,   rot: 180}   # I2C 1: boca hacia el borde superior
  J402: {x_mm: 31,   y_mm: 5.0,   rot: 180}   # I2C 2
  J403: {x_mm: 45,   y_mm: 5.0,   rot: 180}   # SERIE
  J404: {x_mm: 59,   y_mm: 5.0,   rot: 180}   # ANALÓGICO 1
  J405: {x_mm: 73,   y_mm: 5.0,   rot: 180}   # ANALÓGICO 2
  J407: {x_mm: 3,    y_mm: 12.22, rot: 0}     # D0..D13 y GND, pin 1 arriba
  J408: {x_mm: 87,   y_mm: 14.76, rot: 0}     # A0..A7, 5V, 3V3, GND, RESET
  J101: {x_mm: 16,   y_mm: 56.3,  rot: 0}     # USB-C, boca hacia el borde inferior
  J406: {x_mm: 26.8, y_mm: 56.5,  rot: 90}    # SPI en fila horizontal junto al USB-C

# Posiciones aproximadas del resto; tools/colocar.py las ajusta para quitar choques.
aprox:
