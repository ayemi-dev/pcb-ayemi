  U1:   {x_mm: 37,   y_mm: 29.5, rot: 0}
  Y1:   {x_mm: 30.2, y_mm: 38.4, rot: 270}   # rot 270: XT1 arriba-izquierda y XT2 abajo-derecha, sin cruzar
  C1:   {x_mm: 26.0, y_mm: 32.4, rot: 90}
  C2:   {x_mm: 34.3, y_mm: 38.5, rot: 0}
  C3:   {x_mm: 29.0, y_mm: 29.1, rot: 0}
  C4:   {x_mm: 29.0, y_mm: 31.1, rot: 0}
  C5:   {x_mm: 44.0, y_mm: 32.6, rot: 0}
  C6:   {x_mm: 44.0, y_mm: 29.2, rot: 0}
  # --- reinicio ---
  R1:   {x_mm: 27.0, y_mm: 24.6, rot: 90}
  D1:   {x_mm: 24.0, y_mm: 24.6, rot: 90}
  SW1:  {x_mm: 22.5, y_mm: 18.5, rot: 0}
  C103: {x_mm: 20.5, y_mm: 28.6, rot: 0}
  J1:   {x_mm: 41.0, y_mm: 40.0, rot: 0}
  # --- USB: CH340, ESD, CC ---
  U101: {x_mm: 15.0, y_mm: 38.0, rot: 0}
  C101: {x_mm: 20.0, y_mm: 31.5, rot: 90}
  C102: {x_mm: 9.5,  y_mm: 37.0, rot: 90}
  R103: {x_mm: 20.6, y_mm: 36.0, rot: 0}
  R104: {x_mm: 20.6, y_mm: 38.0, rot: 0}
  D101: {x_mm: 22.6, y_mm: 41.0, rot: 0}
  R105: {x_mm: 25.9, y_mm: 41.0, rot: 0}
  D102: {x_mm: 22.6, y_mm: 43.0, rot: 0}
  R106: {x_mm: 25.9, y_mm: 43.0, rot: 0}
  U102: {x_mm: 16.0, y_mm: 47.5, rot: 0}
  R101: {x_mm: 10.5, y_mm: 47.0, rot: 90}
  R102: {x_mm: 21.5, y_mm: 47.0, rot: 90}
  # --- alimentación ---
  F201: {x_mm: 27.0, y_mm: 50.0, rot: 0}
  C201: {x_mm: 31.5, y_mm: 50.0, rot: 0}
  C202: {x_mm: 27.0, y_mm: 46.5, rot: 0}
  U201: {x_mm: 31.5, y_mm: 46.0, rot: 0}
  C203: {x_mm: 35.5, y_mm: 46.5, rot: 0}
  R201: {x_mm: 35.5, y_mm: 50.5, rot: 0}
  D201: {x_mm: 38.5, y_mm: 50.5, rot: 0}
  # --- LEDs, RGB y sensor de luz ---
  D301: {x_mm: 43.0, y_mm: 14.5, rot: 0}
  D302: {x_mm: 50.0, y_mm: 14.5, rot: 0}
  D303: {x_mm: 57.0, y_mm: 14.5, rot: 0}
  R301: {x_mm: 43.0, y_mm: 18.0, rot: 90}
  R302: {x_mm: 50.0, y_mm: 18.0, rot: 90}
  R303: {x_mm: 57.0, y_mm: 18.0, rot: 90}
