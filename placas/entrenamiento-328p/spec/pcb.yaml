# Reglas de cercanía (distancia centro a centro entre la pieza y el pin, ~2 mm de hueco real).
# Las comprueba tools/colocar.py después de colocar.
cerca_de:
  C1:   {pin: "U1.7",  max_mm: 8}
  C2:   {pin: "U1.8",  max_mm: 8}
  Y1:   {pin: "U1.7",  max_mm: 8}
  C3:   {pin: "U1.4",  max_mm: 4}
  C4:   {pin: "U1.6",  max_mm: 4}
  C5:   {pin: "U1.18", max_mm: 4}
  C6:   {pin: "U1.20", max_mm: 4}
  C101: {pin: "U101.16", max_mm: 4}
  C102: {pin: "U101.4",  max_mm: 4}
  U102: {pin: "J101.A6", max_mm: 10}
grupos: []

serigrafia:
  referencias_ocultas: true      # los designadores (R1, C2…) pasan a la capa de fabricación: no se imprimen
  trazo_mm: 0.15
  alias_redes: {A4: "A4 SDA", A5: "A5 SCL", D0: "D0 RX", D1: "D1 TX"}   # nombre en el orden de pines de los conectores
  # Posiciones en mm de la placa (esquina superior izquierda = 0, 0). Cada texto es el centro de un bloque de
  # líneas (separadas por «\n»). `alto_mm` es la altura de letra: 1.0 mm es el mínimo legible (marca.md).
  # Los nombres de periférico de 7 mm de paso (LEDs) se dejan en 1.0 mm; el diseño pedía 1.5 mm, no cabe
  # (reporte de la parada 3).
  arriba:
    logotipo: {svg: spec/logos/ayemi-logotipo.svg, x_mm: 8.0, y_mm: 14.4, ancho_mm: 9.5}
    # Emi de una tinta (manual 2.1, §4.3). El cuerpo completo (18 a 22 mm de alto, 11.3 a 13.8 de ancho) no cabe
    # en ningún hueco de la cara superior, así que va la cabeza, de 10 mm de alto (rasgo mínimo 0.20 mm). x_mm e
    # y_mm son el centro. No se usa emi-monocromo-blanco.svg: tiene grises que la serigrafía no imprime.
    emi: {svg: spec/logos/emi-serigrafia-cabeza.svg, x_mm: 32.4, y_mm: 17.0, alto_mm: 10.0}
    textos:
      - {texto: "Chispa por\nAyemi · v0.1", x_mm: 13.4, y_mm: 23.6, alto_mm: 1.0}
      - {texto: "I2C 1", x_mm: 17, y_mm: 10.7, alto_mm: 1.0}
      - {texto: "I2C 2", x_mm: 31, y_mm: 10.7, alto_mm: 1.0}
      - {texto: "SERIE", x_mm: 45, y_mm: 10.7, alto_mm: 1.0}
      - {texto: "ANALÓGICO 1", x_mm: 59, y_mm: 10.7, alto_mm: 1.0}
      - {texto: "ANALÓGICO 2", x_mm: 73, y_mm: 10.7, alto_mm: 1.0}
      - {texto: "LED rojo\nD7", x_mm: 42.4, y_mm: 21.7, alto_mm: 1.0}
      - {texto: "LED verde\nD8", x_mm: 50.5, y_mm: 21.7, alto_mm: 1.0}
      - {texto: "LED L\nD13", x_mm: 57.7, y_mm: 21.7, alto_mm: 1.0}
      - {texto: "RGB\nD9 D6 D5", x_mm: 66.5, y_mm: 21.7, alto_mm: 1.0}
      - {texto: "Botón A\nD2", x_mm: 51.0, y_mm: 25.9, alto_mm: 1.2}
      - {texto: "Botón B\nD4", x_mm: 61.5, y_mm: 25.9, alto_mm: 1.2}
      - {texto: "Perilla\nA6", x_mm: 78.5, y_mm: 37.4, alto_mm: 1.2}
      - {texto: "Buzzer\nD3", x_mm: 46.4, y_mm: 36.0, alto_mm: 1.0}
      - {texto: "RESET", x_mm: 22.5, y_mm: 14.0, alto_mm: 1.0}
      - {texto: "TX", x_mm: 19.8, y_mm: 41.0, alto_mm: 1.0}
      - {texto: "RX", x_mm: 19.8, y_mm: 43.0, alto_mm: 1.0}
      - {texto: "5V", x_mm: 38.5, y_mm: 52.6, alto_mm: 1.0}
      - {texto: "ICSP", x_mm: 42.25, y_mm: 37.4, alto_mm: 1.0}
      - {texto: "SPI", x_mm: 23.4, y_mm: 56.5, alto_mm: 1.0}
      - {texto: "A6 = perilla\nA7 = luz", x_mm: 79.6, y_mm: 49.0, alto_mm: 1.0, alinear: izq}
      - {texto: "ON = conectado", x_mm: 68.0, y_mm: 58.6, alto_mm: 1.0}
    pines:          # rótulo de cada pin con el nombre de su red
      - {ref: J407, lado: derecha, dx_mm: 2.2, alto_mm: 1.0}
      - {ref: J408, lado: izquierda, dx_mm: 1.9, alto_mm: 1.0}
      - {ref: J406, lado: abajo, dy_mm: 2.6, alto_mm: 1.0, sin_prefijo_D: true}
    dip:            # nombre corto de cada posición, en vertical, sobre la fila de periféricos
      ref: SW303
      alto_mm: 1.0
      dy_mm: 3.0
      nombres: {BTN_A: BtnA, BZ_IN: Buzz, BTN_B: BtnB, RGB_B: RGBa, RGB_G: RGBv, LED_R: LEDr, LED_G: LEDv, RGB_R: RGBr}
  abajo:
    textos:
      - {texto: "Hardware abierto\nCERN-OHL-S-2.0", x_mm: 45, y_mm: 26, alto_mm: 1.2}
      - {texto: "Compatible con el IDE de Arduino\n(placa: Uno)", x_mm: 45, y_mm: 33, alto_mm: 1.2}
      - {texto: "Chispa por Ayemi · v0.1", x_mm: 45, y_mm: 48, alto_mm: 1.2}
    # QR de https://ayemi.org/p/328, generado con tools/qr_serigrafia.py. Polaridad normal: el blanco son los módulos
    # claros y la zona de silencio; la máscara negra hace de módulo oscuro. Lado de 14 mm con la zona de silencio
    # incluida (módulo de 0.48 mm); el mínimo es 12 mm. Se imprime reflejado para leerse desde la cara inferior.
    qr: {svg: spec/logos/qr.svg, x_mm: 74.0, y_mm: 41.5, lado_mm: 14}
    conectores:     # orden de pines en la cara inferior, bajo cada conector
      refs: [J401, J402, J403, J404, J405]
      y_mm: 4.5
      alto_mm: 1.0

# Diagrama de pines (tools/renders.py): qué se rotula y con qué texto.
diagrama_pines:
  headers: {J407: derecha, J408: izquierda, J406: abajo}
  conectores: [J401, J402, J403, J404, J405]
  nombres_conectores: {J401: "I2C 1", J402: "I2C 2", J403: "SERIE", J404: "ANALÓGICO 1", J405: "ANALÓGICO 2"}
  alias: {A4: "A4 SDA", A5: "A5 SCL", D0: "D0 RX", D1: "D1 TX"}
  dip: {ref: SW303, nombres: {BTN_A: "1 Botón A", BZ_IN: "2 Buzzer", BTN_B: "3 Botón B", RGB_B: "4 RGB azul", RGB_G: "5 RGB verde", LED_R: "6 LED rojo", LED_G: "7 LED verde", RGB_R: "8 RGB rojo"}}
  perifericos:
    - {ref: D301, texto: "LED rojo · D7"}
    - {ref: D302, texto: "LED verde · D8", dy_mm: 4}
    - {ref: D303, texto: "LED L · D13"}
    - {ref: D304, texto: "RGB · D9 D6 D5"}
    - {ref: SW301, texto: "Botón A · D2"}
    - {ref: SW302, texto: "Botón B · D4"}
    - {ref: BZ301, texto: "Buzzer · D3"}
    - {ref: RV301, texto: "Perilla · A6", dx_mm: 7, dy_mm: 3}
    - {ref: Q302, texto: "Luz · A7", dx_mm: -2, dy_mm: 5, ancla: end}
    - {ref: SW1, texto: "RESET"}
    - {ref: J101, texto: "USB-C", dy_mm: -3}
    - {ref: D101, texto: "TX", dx_mm: -3}
    - {ref: D102, texto: "RX", dx_mm: -3}
    - {ref: D201, texto: "5V ON", dy_mm: 4}

fab:
  carpeta: fab/v0.1
  existencias_aceptadas:
    C84681: "CH340C: JLCPCB la marca como descontinuada, pero hay más de 100 000 unidades (50 placas necesitan 50). Plan B CH340N o CH340K en reportes/piezas.md."
  capas_gerber: [F.Cu, B.Cu, F.Paste, F.Silkscreen, B.Silkscreen, F.Mask, B.Mask, Edge.Cuts]
rotacion_jlc: {}    # huella: grados a sumar en el CPL (se descubre en la vista previa de JLC)

# Modelos 3D sencillos (tools/modelos3d.py) para las piezas que las librerías de KiCad no traen. Son cajas y
# cilindros apoyados en la placa; `centro_mm` está en el sistema de la huella (y hacia abajo). Las medidas salen de
# la huella o de listados de la pieza; las hojas de datos de fabricante de estas piezas no están leídas completas
# y las alturas se revisan en «Pendiente antes de fabricar» (README).
modelos_3d:
  carpeta: lib/ayemi.3dshapes
  piezas:
    - huella: "Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12"
      archivo: usb_c_hro_type_c_31_m_12
      forma: caja
      centro_mm: [0, 0]
      ancho_mm: 8.94
      fondo_mm: 7.30
      alto_mm: 3.26
      color: [0.72, 0.72, 0.75]
      fuente: "J101. 8.94 x 7.3 mm: listado del TYPE-C-31-M-12 en un distribuidor; alto 3.26 mm (+-0.15): medición publicada del mismo conector. Huella de KiCad: caja de 9.04 x 7.40 mm."
    - huella: "Connector_JST:JST_PH_S4B-PH-SM4-TB_1x04-1MP_P2.00mm_Horizontal"
      archivo: jst_ph_s4b_ph_sm4_tb
      forma: caja
      centro_mm: [0, 0.6]
      ancho_mm: 12.0
      fondo_mm: 7.7
      alto_mm: 5.51
      color: [0.92, 0.90, 0.82]
      fuente: "J401 a J405. Ancho y fondo: el contorno de fabricación de la huella (12.0 x 7.7 mm, incluye las patas); alto: 5.51 mm de altura del aislante según el listado de DigiKey."
    - huella: "Buzzer_Beeper:MagneticBuzzer_CUI_CMT-8504-100-SMT"
      archivo: zumbador_8_5mm
      forma: cilindro
      centro_mm: [0, 0]
      diametro_mm: 8.5
      alto_mm: 3.0
      color: [0.08, 0.08, 0.08]
      fuente: "BZ301. Diámetro de la huella (8.5 mm). Alto de 3.0 mm ESTIMADO: el número de la pieza real (Fengming YS-SBZ8530C05R30) sigue la convención 8530 = 8.5 x 3.0 mm; la hoja de datos no se pudo leer. La huella es de otra pieza (CUI CMT-8504, 4 mm de alto)."
    - huella: "Potentiometer_THT:Potentiometer_Alps_RK09K_Single_Vertical"
      archivo: potenciometro_rk09k_cuerpo
