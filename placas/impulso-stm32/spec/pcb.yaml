#  Impulso por Ayemi (STM32F411) · spec de la placa
#  Fuente de verdad para tools/pcb_setup.py, colocar.py, rutear.py, costura.py, serigrafia.py y fab.py.
#  Misma cadena y mismas reglas que Chispa (placas/entrenamiento-328p/spec/pcb.yaml).
# =============================================================================

placa:
  nombre: "Impulso por Ayemi"
  version: "0.1"
  ancho_mm: 100
  alto_mm: 70
  radio_esquinas_mm: 3
  capas: 2
  grosor_mm: 1.6
  mascara: negra
  serigrafia: blanca
  piezas_solo_arriba: true
  origen_mm: [100, 80]

barrenos:
  tipo: M3
  separacion_borde_mm: 4
  huella: "MountingHole:MountingHole_3.2mm_M3"
  posiciones: [[4, 4], [96, 4], [4, 66], [96, 66]]
  exclusion_mm: 6.4

reglas:
  pista_minima_mm: 0.15
  separacion_minima_mm: 0.1
  via_diametro_mm: 0.5      # JLCPCB acepta vías desde 0.35 mm (taladro 0.2 + 0.15); 0.5 / 0.3 deja pasar un carril de 0.15 mm entre vías de patas vecinas del QFN
  via_taladro_mm: 0.3
  anillo_minimo_mm: 0.1
  cobre_a_borde_mm: 0.3
  taladro_minimo_mm: 0.3
  taladro_a_cobre_mm: 0.15     # JLCPCB no pide más; el ruteador deja 0.15 mm entre cobre y cobre
  serigrafia_alto_min_mm: 1.0
  serigrafia_trazo_min_mm: 0.15

clases_de_red:
  Default:  {pista_mm: 0.25, separacion_mm: 0.15, separacion_drc_mm: 0.1}   # el ruteador deja 0.15 mm; el DRC exige el mínimo de JLCPCB (0.1 mm) por el error de rejilla
  Potencia: {pista_mm: 0.5,  separacion_mm: 0.2, separacion_drc_mm: 0.1, redes: ["+5V", VBUS, GND]}
  USB:      {pista_mm: 0.3,  separacion_mm: 0.2, separacion_drc_mm: 0.1, redes: [USB_DP, USB_DM]}

planos:
  - {red: GND, capas: [F.Cu, B.Cu], margen_borde_mm: 0.5, separacion_mm: 0.3}

costura_gnd:
  rejilla_mm: 5
  borde_paso_mm: 3
  borde_margen_mm: 1.5

ruteo:
  resolucion_mm: 0.1
  pasadas: 14
  limite_nodos: 300000
  ripup_local: true
  abanico: [U1, {ref: SW303, mm: 0.5, filas: 1}]           # QFN-48 de 0.5 mm: de cada pata sale un tramo recto antes de rutear
  abanico_mm: 0.65
  abanico_via: true
  abanico_filas: 3          # vías del QFN en tres filas (0.65, 1.3 y 1.95 mm)
  abanico_clase: Fino
  abanico_excluir: [GND]
  holgura_mm: 0.0          # sin margen extra de rejilla: los carriles de 0.5 mm del QFN no caben con 0.07 mm
  sin_vias: [XT1, XT2]    # las pistas del cristal van en la cara superior y sin vías
  refinar_s: 300
  mejora_s: 0
  fino: {pista_mm: 0.15, separacion_mm: 0.15}
  ventanas:
    - {nombre: "USB-C", x_mm: [7, 47.5], y_mm: [31, 69], resolucion_mm: 0.05, ancho_mm: 0.2, ancho_medio_mm: 0.4, redes: [CC1, CC2, USB_DM, USB_DP, VBUS], redes_medias: [VBUS], gnd_pads: [U102.2]}

areas_prohibidas:
  - nombre: CRISTAL
    descripcion: "Debajo del cristal y sus capacitores: solo GND y las dos redes del cristal"
    refs: [Y1, C1, C2]
    margen_mm: 0.3
    redes_permitidas: [GND, XT1, XT2]

  # Las cinco zonas de exclusión de cobre de la huella oficial de la ranura microSD (Hirose DM3AT), trasladadas a la
  # placa con J411 en (13.9, 28.0) y giro de 270 grados. El ruteador no lee las zonas de las huellas: se repiten aquí
  # como rectángulos para que no pase ninguna pista; el DRC sigue comprobando las zonas originales.
  - {nombre: SD_ZONA_1, descripcion: "Exclusión de la huella DM3AT", rect_mm: [17.925, 20.775, 21.175, 21.525], margen_mm: 0.0, redes_permitidas: [], bloquea_cobre: true, capas: [F.Cu]}
  - {nombre: SD_ZONA_2, descripcion: "Exclusión de la huella DM3AT", rect_mm: [13.125, 20.775, 16.725, 21.525], margen_mm: 0.0, redes_permitidas: [], bloquea_cobre: true, capas: [F.Cu]}
  - {nombre: SD_ZONA_3, descripcion: "Exclusión de la huella DM3AT", rect_mm: [7.725, 21.875, 15.325, 22.575], margen_mm: 0.0, redes_permitidas: [], bloquea_cobre: true, capas: [F.Cu]}
  - {nombre: SD_ZONA_4, descripcion: "Exclusión de la huella DM3AT", rect_mm: [5.575, 30.925, 6.925, 33.475], margen_mm: 0.0, redes_permitidas: [], bloquea_cobre: true, capas: [F.Cu]}
  - {nombre: SD_ZONA_5, descripcion: "Exclusión de la huella DM3AT", rect_mm: [15.025, 22.575, 16.625, 31.275], margen_mm: 0.0, redes_permitidas: [], bloquea_cobre: true, capas: [F.Cu]}

zonas:
  usb:        {borde: inferior, nota: "USB-C con la boca hacia afuera"}
  sd:         {borde: izquierdo, nota: "Ranura microSD con la boca hacia el borde izquierdo"}
  conectores: {borde: superior, nota: "Los 5 conectores de 4 pines en el borde superior, boca hacia afuera, paso de 14 mm"}
  manos:      {x_mm: [44, 84], y_mm: [10, 56], nota: "Botones, potenciómetro, buzzer y DIP"}

fijos:
  H1:   {x_mm: 4,    y_mm: 4,     rot: 0}
  H2:   {x_mm: 96,   y_mm: 4,     rot: 0}
  H3:   {x_mm: 4,    y_mm: 66,    rot: 0}
  H4:   {x_mm: 96,   y_mm: 66,    rot: 0}
  J401: {x_mm: 17,   y_mm: 5.0,   rot: 180}
  J402: {x_mm: 31,   y_mm: 5.0,   rot: 180}
  J403: {x_mm: 45,   y_mm: 5.0,   rot: 180}
  J404: {x_mm: 59,   y_mm: 5.0,   rot: 180}
  J405: {x_mm: 73,   y_mm: 5.0,   rot: 180}
  J407: {x_mm: 97,   y_mm: 10, rot: 0}     # IO A (10 pines) en el borde derecho
  J1:   {x_mm: 97,   y_mm: 38,  rot: 0}     # SWD (5 pines) en el borde derecho, debajo de IO A
  J101: {x_mm: 16,   y_mm: 66.3,  rot: 0}
  J409: {x_mm: 23.5, y_mm: 66.5,  rot: 90}    # SPI en fila horizontal en el borde inferior
  J408: {x_mm: 40.1, y_mm: 66.5,  rot: 90}    # IO B en fila horizontal en el borde inferior
  J411: {x_mm: 13.9, y_mm: 28.0,  rot: 270}   # microSD con la boca en el borde izquierdo
  U1:   {x_mm: 50.05, y_mm: 38.05, rot: 180}   # patas de SD y USB hacia la izquierda, cristal hacia la derecha

