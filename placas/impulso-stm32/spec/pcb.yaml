    # Emi de una tinta, versión de cabeza (el cuerpo completo no cabe en la cara superior).
    emi: {svg: spec/logos/emi-serigrafia-cabeza.svg, x_mm: 7.5, y_mm: 16.2, alto_mm: 7.0}
    textos:
      - {texto: "Impulso por\nAyemi · v0.1", x_mm: 16.8, y_mm: 18.9, alto_mm: 1.0}
