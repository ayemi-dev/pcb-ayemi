      - {texto: "3.3 V", x_mm: 17, y_mm: 12.4, alto_mm: 1.0}
      - {texto: "3.3 V", x_mm: 31, y_mm: 12.4, alto_mm: 1.0}
      - {texto: "3.3 V", x_mm: 45, y_mm: 12.4, alto_mm: 1.0}
      - {texto: "3.3 V", x_mm: 59, y_mm: 12.4, alto_mm: 1.0}
