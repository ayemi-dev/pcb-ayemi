cerca_de:
  C1:   {pin: "U1.2",  max_mm: 8}
  C2:   {pin: "U1.2",  max_mm: 8}
  C3:   {pin: "U1.2",  max_mm: 10}
  U102: {pin: "J101.A6", max_mm: 10}
grupos: []

serigrafia:
  referencias_ocultas: true
  trazo_mm: 0.15
  alias_redes: {IO8: "IO8 SDA", IO9: "IO9 SCL", IO44: "IO44 RX", IO43: "IO43 TX"}
  arriba:
    logotipo: {svg: spec/logos/ayemi-logotipo.svg, x_mm: 9.8, y_mm: 17.6, ancho_mm: 9.5}
    # Emi de una tinta, versión de cabeza: el cuerpo completo (18 a 22 mm de alto) no cabe en la cara superior.
    emi: {svg: spec/logos/emi-serigrafia-cabeza.svg, x_mm: 30.5, y_mm: 23.5, alto_mm: 10.0}
    textos:
      - {texto: "Enlace por\nAyemi · v0.1", x_mm: 14.4, y_mm: 22.6, alto_mm: 1.0}
