#  Enlace por Ayemi (ESP32-S3) · spec de la placa
#  Fuente de verdad para tools/pcb_setup.py, colocar.py, rutear.py, costura.py, serigrafia.py y fab.py.
#  Misma cadena y mismas reglas que Chispa (placas/entrenamiento-328p/spec/pcb.yaml).
# =============================================================================

placa:
  nombre: "Enlace por Ayemi"
  version: "0.1"
  ancho_mm: 90
  alto_mm: 60
  radio_esquinas_mm: 3
  capas: 2
  grosor_mm: 1.6
  mascara: negra
  serigrafia: blanca
  piezas_solo_arriba: true
  origen_mm: [100, 80]

barrenos:
  tipo: M3
  separacion_borde_mm: 4
  huella: "MountingHole:MountingHole_3.2mm_M3"
  posiciones: [[4, 4], [86, 4], [4, 56], [86, 56]]
  exclusion_mm: 6.4

reglas:
  pista_minima_mm: 0.15
  separacion_minima_mm: 0.15
  via_diametro_mm: 0.6
  via_taladro_mm: 0.3
  anillo_minimo_mm: 0.15
  cobre_a_borde_mm: 0.3
  taladro_minimo_mm: 0.3
  serigrafia_alto_min_mm: 1.0
  serigrafia_trazo_min_mm: 0.15

clases_de_red:
  Default:  {pista_mm: 0.25, separacion_mm: 0.2}
  Potencia: {pista_mm: 0.5,  separacion_mm: 0.2, redes: ["+5V", "+3V3", VBUS, GND]}
  USB:      {pista_mm: 0.3,  separacion_mm: 0.2, redes: [USB_DP, USB_DM]}

planos:
  - {red: GND, capas: [F.Cu, B.Cu], margen_borde_mm: 0.5, separacion_mm: 0.3}

costura_gnd:
  evitar_mm: [[78.0, 42.7]]   # isla de GND de 2 mm² entre R309, R310 y pistas del DIP: una vía ahí la une a una isla en B.Cu, sin salida al plano
  rejilla_mm: 5
  borde_paso_mm: 3
  borde_margen_mm: 1.5

# Copia de la huella oficial del módulo sin las vías térmicas de 0.2 mm (bajo el mínimo de 0.3 mm de JLCPCB) y con la
# cortesía reducida al cuerpo: la oficial incluye 15 mm de aire alrededor de la antena. La antena se protege con
# `areas_prohibidas` (ANTENA).
huellas_locales:
  - origen: "RF_Module:ESP32-S3-WROOM-1"
    nombre: "ESP32-S3-WROOM-1_ayemi"
    quitar_taladros_menores_mm: 0.3
    quitar_zonas: true
    cortesia_mm: [-9.3, -13.05, 9.3, 13.3]
  # La huella oficial del SHT4x trae una zona de exclusión (keepout) de cobre en F.Cu que prohíbe pistas y vías
  # junto al sensor. Se quita en la copia local; el sensor se ve afectado por el calor de las pistas cercanas
  # (se anota en el README, «Pendiente antes de fabricar»).
  - origen: "Sensor_Humidity:Sensirion_DFN-4_1.5x1.5mm_P0.8mm_SHT4x_NoCentralPad"
    nombre: "SHT4x_ayemi"
    quitar_zonas: true

ruteo:
  resolucion_mm: 0.1
  pasadas: 1
  abanico: [U1]
  abanico_mm: 1.0
  sin_vias: []
  refinar_s: 600
  mejora_s: 1200
  fino: {pista_mm: 0.2, separacion_mm: 0.2}
  ventanas:
    - {nombre: "USB-C", x_mm: [7, 50], y_mm: [30, 59], resolucion_mm: 0.05, ancho_mm: 0.2, ancho_medio_mm: 0.4, redes: [CC1, CC2, USB_DM, USB_DP, VBUS], redes_medias: [VBUS], gnd_pads: [U102.2]}

# Zona de la antena del módulo (cuerpo girado 180°: la antena queda hacia el borde inferior). Sin pistas, vías ni
# cobre en las dos caras. Coordenadas de la placa; se calcula desde la posición fija de U1.
areas_prohibidas:
  - nombre: ANTENA
    descripcion: "Antena de PCB del ESP32-S3-WROOM-1: sin cobre ni pistas en las dos caras"
    rect_mm: [27.55, 52.8, 47.15, 60.5]
    margen_mm: 0.0
    redes_permitidas: []
    bloquea_cobre: true

zonas:
  usb:        {borde: inferior, nota: "USB-C con la boca hacia afuera"}
  antena:     {borde: inferior, nota: "Módulo con la antena en el borde inferior, entre el USB-C y el DIP"}
  conectores: {borde: superior, nota: "Los 5 conectores de 4 pines en el borde superior, boca hacia afuera, paso de 14 mm"}
  manos:      {x_mm: [44, 84], y_mm: [10, 56], nota: "Botones, potenciómetro, buzzer y DIP"}

fijos:
  H1:   {x_mm: 4,    y_mm: 4,     rot: 0}
  H2:   {x_mm: 86,   y_mm: 4,     rot: 0}
  H3:   {x_mm: 4,    y_mm: 56,    rot: 0}
  H4:   {x_mm: 86,   y_mm: 56,    rot: 0}
  J401: {x_mm: 17,   y_mm: 5.0,   rot: 180}
  J402: {x_mm: 31,   y_mm: 5.0,   rot: 180}
  J403: {x_mm: 45,   y_mm: 5.0,   rot: 180}
  J404: {x_mm: 59,   y_mm: 5.0,   rot: 180}
  J405: {x_mm: 73,   y_mm: 5.0,   rot: 180}
  J408: {x_mm: 3,    y_mm: 12.22, rot: 0}     # IO B (12 pines) en el borde izquierdo
  J407: {x_mm: 87,   y_mm: 14.76, rot: 0}     # IO A (10 pines) en el borde derecho
  J101: {x_mm: 16,   y_mm: 56.3,  rot: 0}
  U1:   {x_mm: 37.35, y_mm: 46.95, rot: 180}  # antena hacia el borde inferior

